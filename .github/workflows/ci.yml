name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate official Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Validate Gradle wrapper JAR
        run: sha256sum --check gradle/wrapper/gradle-wrapper.jar.sha256

      - name: Validate archive installers and license notices
        run: |
          bash -n apps/tuink/packaging/archive/install.sh apps/tuink/packaging/archive/uninstall.sh
          python3 -B apps/tuink/packaging/archive/test_archive_install.py
          python3 -B apps/tuink/packaging/debian/test_native_dependencies.py
          python3 -B .github/scripts/test_publish_release.py
          python3 -B .github/scripts/test_release_dispatch.py

      - name: Set up the pinned Oracle GraalVM SDK
        uses: ./.github/actions/setup-graalvm

      - name: Install Linux ACL tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes acl

      - name: Set up the Gradle cache
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Validate, test, and package
        run: >-
          ./gradlew --no-daemon --stacktrace --warning-mode=fail -PenablePgo
          :app:verifyNativeToolchain check :app:distZip :app:perfHarnessTest :app:pgoHarnessTest

      - name: Check keyboard, pointer, viewport, history, and recovery in a PTY
        run: ./gradlew --no-daemon --stacktrace --warning-mode=fail :app:uiRegressionTest
