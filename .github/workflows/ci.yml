name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate official Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Validate Gradle wrapper JAR
        run: sha256sum --check gradle/wrapper/gradle-wrapper.jar.sha256

      - name: Set up Java 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Validate, test, and package
        run: >-
          ./gradlew --no-daemon --stacktrace --warning-mode=fail -PenablePgo
          check :app:distZip :app:perfHarnessTest :app:pgoHarnessTest
