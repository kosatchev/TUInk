plugins {
    id 'application'
    id 'org.graalvm.buildtools.native' version '0.10.6'
}

dependencies {
    implementation project(':tui')
    testImplementation 'com.tngtech.archunit:archunit:1.4.2'
}

application {
    applicationName = 'tuink'
    mainClass = 'dev.tuink.app.App'
}

tasks.named('run', JavaExec) {
    standardInput = System.in
    if (project.hasProperty('appArgs')) {
        args(project.property('appArgs').toString().split('\\s+').findAll { !it.isBlank() })
    }
}

tasks.named('distTar') {
    enabled = false
    group = null
    description = 'Disabled: use distZip for JVM releases or nativeDistTarGz for native releases.'
}

apply from: "${rootProject.projectDir}/gradle/scripts/native.gradle"
if (project.hasProperty('enablePgo')) {
    apply from: "${rootProject.projectDir}/gradle/scripts/pgo.gradle"
}
apply from: "${rootProject.projectDir}/gradle/scripts/distributions.gradle"
apply from: "${rootProject.projectDir}/gradle/scripts/debian.gradle"
apply from: "${rootProject.projectDir}/gradle/scripts/performance.gradle"
