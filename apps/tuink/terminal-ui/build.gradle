plugins {
    id 'java'
}

sourceSets.test.java.srcDir(rootProject.file('verification/fixtures/java'))

dependencies {
    implementation project(':markdown-preview')
    implementation project(':markdown-commonmark')
    implementation project(':markdown-math')
    implementation project(':markdown-mermaid')
    implementation project(':tuiframe-core')
    implementation project(':tuiframe-jline')
    implementation project(':tuiframe-widgets')
    implementation project(':tuiframe-explorer')
    implementation project(':editor-contract')
    implementation project(':core')
    implementation project(':project-search')
    implementation project(':project-search-jvm')
    implementation project(':editor-session')
    implementation project(':render')
    implementation project(':highlight-regex')
    implementation project(':editor-diff-jgit')
    implementation project(':editor-storage-jvm')
    // Libraries must not write a missing-binding warning over the terminal UI.
    runtimeOnly 'org.slf4j:slf4j-nop:1.7.36'
    testImplementation project(':unicode-text')
}

def tuinkVersion = project.version.toString()

tasks.named('processResources') {
    inputs.property('tuinkVersion', tuinkVersion)
    filesMatching('tuink-version.properties') {
        expand(version: tuinkVersion)
    }
}
