dependencies {
    implementation project(':tui-core')
    implementation project(':tui-jline')
    implementation project(':tui-widgets')
    implementation project(':core')
    implementation project(':render')
    implementation project(':highlight-regex')
}

def tuinkVersion = project.version.toString()

tasks.named('processResources') {
    inputs.property('tuinkVersion', tuinkVersion)
    filesMatching('tuink-version.properties') {
        expand(version: tuinkVersion)
    }
}
