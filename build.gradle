allprojects {
    group = 'dev.tuink'
    version = '0.9.0'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    }
}

tasks.register('buildApp') {
    group = 'application'
    description = 'Build the app module (canonical entrypoint).'
    dependsOn ':app:build'
}

tasks.register('runApp') {
    group = 'application'
    description = 'Run the app module (canonical entrypoint).'
    dependsOn ':app:run'
}
