    ':markdown-preview': [':editor-contract'] as Set,
    ':markdown-commonmark': [':markdown-preview'] as Set,
    ':markdown-math': [':markdown-preview'] as Set,
    ':markdown-mermaid': [':markdown-preview'] as Set,
    ':unicode-text'    : [] as Set,
    ':tuiframe-core'   : [] as Set,
    ':tuiframe-jline'  : [':tuiframe-core'] as Set,
    ':tuiframe-widgets': [':tuiframe-core'] as Set,
    ':tuiframe-explorer': [':tuiframe-core', ':tuiframe-widgets'] as Set,
    ':editor-contract' : [] as Set,
    ':core'            : [':unicode-text', ':editor-contract'] as Set,
    ':editor-session'  : [':editor-contract', ':core'] as Set,
    ':editor-diff-jgit': [':editor-contract'] as Set,
    ':editor-storage-jvm': [':core', ':editor-contract'] as Set,
    ':render'          : [':tuiframe-core', ':editor-contract', ':core', ':markdown-preview'] as Set,
    ':highlight-regex' : [':editor-contract', ':render'] as Set,
    ':tui'             : [':tuiframe-core', ':tuiframe-jline', ':tuiframe-widgets', ':tuiframe-explorer', ':editor-contract', ':core',
                         ':editor-session', ':render', ':highlight-regex', ':editor-diff-jgit',
                         ':editor-storage-jvm', ':markdown-preview', ':markdown-commonmark',
                         ':markdown-math', ':markdown-mermaid'] as Set,
    ':app'            : [':tui'] as Set
]
def allowedTestProjectDependencies = [
    ':core': [':editor-diff-jgit', ':editor-storage-jvm'] as Set,
    ':editor-storage-jvm': [':unicode-text'] as Set,
    ':editor-session': [':editor-storage-jvm', ':unicode-text'] as Set,
    ':render': [':editor-storage-jvm'] as Set,
    ':tui': [':unicode-text'] as Set
]
def expectedProjectGroups = [
    ':tuiframe-core'   : 'dev.tuiframe',
    ':tuiframe-jline'  : 'dev.tuiframe',
    ':tuiframe-widgets': 'dev.tuiframe',
    ':tuiframe-explorer': 'dev.tuiframe'
]
def externallyDependencyFreeProductionConfigurations = [
    'annotationProcessor',
    'api',
    'compileOnly',
    'compileOnlyApi',
    'implementation',
    'runtimeOnly'
] as Set
def projectsByPath = subprojects.collectEntries { [(it.path): it] }
def portableRuntimeProjects = [
    ':markdown-preview': [':markdown-preview', ':editor-contract'] as Set,
    ':markdown-math': [':markdown-math', ':markdown-preview', ':editor-contract'] as Set,
    ':markdown-mermaid': [':markdown-mermaid', ':markdown-preview', ':editor-contract'] as Set,
    ':markdown-commonmark': [':markdown-commonmark', ':markdown-preview', ':editor-contract'] as Set,
    ':unicode-text': [':unicode-text'] as Set,
    ':editor-contract': [':editor-contract'] as Set,
    ':core': [':core', ':unicode-text', ':editor-contract'] as Set,
    ':editor-session': [':editor-session', ':core', ':unicode-text', ':editor-contract'] as Set,
    ':highlight-regex': [':highlight-regex', ':editor-contract'] as Set
]
def rootVersionForHelp = rootProject.version.toString()
def java17Consumer = configurations.create('portableJava17Consumer') {
    description = 'External Java 17 runtime variant selection for the shared engine.'
    canBeConsumed = false
    canBeResolved = true
    attributes {
        attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
        attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
        attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
        attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 17)
    }
}
def coreJava17ApiConsumer = configurations.create('coreJava17ApiConsumer') {
    description = 'Compile variant consumed by a Java 17 client depending only on core.'
    canBeConsumed = false
    canBeResolved = true
    attributes {
        attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_API))
        attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
        attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
        attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 17)
    }
}
def sessionJava17ApiConsumer = configurations.create('sessionJava17ApiConsumer') {
    description = 'Compile variant consumed by a Java 17 client depending only on editor-session.'
    canBeConsumed = false
    canBeResolved = true
    attributes {
        attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_API))
        attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
        attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
        attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 17)
    }
}
dependencies {
    portableJava17Consumer project(':markdown-commonmark')
    portableJava17Consumer project(':markdown-math')
    portableJava17Consumer project(':markdown-mermaid')
    portableJava17Consumer project(':editor-session')
    portableJava17Consumer project(':highlight-regex')
    add('coreJava17ApiConsumer', project(':core'))
    add('sessionJava17ApiConsumer', project(':editor-session'))
}

def verifyCoreJava17Api = tasks.register('verifyCoreJava17Api', JavaCompile) {
    group = 'verification'
    description = 'Compile an external core API consumer through its Java 17 Gradle variant.'
    source(file('verification/compatibility/jvm/PortableCoreApiProbe.java'))
    classpath = coreJava17ApiConsumer
    destinationDirectory = layout.buildDirectory.dir('compatibility/java17-core-api')
    sourceCompatibility = '17'
    targetCompatibility = '17'
    options.release = 17
    javaCompiler = providers.provider {
        projectsByPath[':core'].tasks.named('compileJava', JavaCompile).get().javaCompiler.get()
    }
}

def verifySessionJava17Api = tasks.register('verifySessionJava17Api', JavaCompile) {
    group = 'verification'
    description = 'Compile a portable document I/O client using only the public session API.'
    source(file('verification/compatibility/jvm/PortableSessionIoApiProbe.java'))
    classpath = sessionJava17ApiConsumer
    destinationDirectory = layout.buildDirectory.dir('compatibility/java17-session-api')
    sourceCompatibility = '17'
    targetCompatibility = '17'
    options.release = 17
    javaCompiler = providers.provider {
        projectsByPath[':core'].tasks.named('compileJava', JavaCompile).get().javaCompiler.get()
    }
}

def verifyProjectDependencies = tasks.register('verifyProjectDependencies') {
    group = 'verification'
    description = 'Verify module boundaries, portable runtime dependencies and terminal-backend isolation.'
    notCompatibleWithConfigurationCache('Reads the configured multi-project dependency model.')

    doLast {
        Set<String> currentProjects = subprojects.collect { it.path } as Set
        Set<String> unclassifiedProjects = currentProjects - allowedProjectDependencies.keySet()
        if (!unclassifiedProjects.isEmpty()) {
            throw new GradleException(
                "Unclassified project modules: ${unclassifiedProjects.sort()}. "
                    + 'Add their allowed dependencies to allowedProjectDependencies.'
            )
        }

        Set<String> violations = [] as Set
        expectedProjectGroups.each { projectPath, expectedGroup ->
            String actualGroup = projectsByPath[projectPath].group.toString()
            if (actualGroup != expectedGroup) {
                violations.add(
                    "${projectPath} has Maven group ${actualGroup}; expected ${expectedGroup}"
                )
            }
        }
        subprojects.each { sourceProject ->
            Set<String> allowed = allowedProjectDependencies[sourceProject.path]
            sourceProject.configurations.each { configuration ->
                configuration.dependencies
                    .withType(org.gradle.api.artifacts.ProjectDependency)
                    .each { dependency ->
                        boolean allowedInTests = configuration.name.startsWith('test')
                            && (allowedTestProjectDependencies[sourceProject.path] ?: [] as Set)
                                .contains(dependency.path)
                        if (dependency.path != sourceProject.path && !allowed.contains(dependency.path)
                            && !allowedInTests) {
                            violations.add(
                                "${sourceProject.path}:${configuration.name} -> ${dependency.path}"
                            )
                        }
                    }
                configuration.dependencies
                    .withType(org.gradle.api.artifacts.ExternalModuleDependency)
                    .each { dependency ->
                        if (sourceProject.path != ':tuiframe-jline' && dependency.group == 'org.jline') {
                            violations.add(
                                "${sourceProject.path}:${configuration.name} -> "
                                    + "${dependency.group}:${dependency.name}"
                            )
                        }
                        if ([':unicode-text', ':tuiframe-core', ':tuiframe-widgets', ':tuiframe-explorer', ':editor-contract',
                             ':editor-session'].contains(sourceProject.path)
                            && externallyDependencyFreeProductionConfigurations.contains(configuration.name)) {
                            violations.add(
                                "${sourceProject.path}:${configuration.name} -> "
                                    + "${dependency.group}:${dependency.name}"
                            )
                        }
                    }
            }
        }

        projectsByPath[':editor-session'].configurations
            .matching { it.name in ['api', 'compileOnlyApi'] }
            .each { configuration ->
                configuration.dependencies
                    .withType(org.gradle.api.artifacts.ProjectDependency)
                    .matching { it.path == ':core' }
                    .each {
                        violations.add(
                            ":editor-session:${configuration.name} must not export :core"
                        )
                    }
            }

        portableRuntimeProjects.each { projectPath, allowedRuntime ->
            projectsByPath[projectPath].configurations.runtimeClasspath.incoming
                .resolutionResult.allComponents.each { component ->
                    if (component.id instanceof org.gradle.api.artifacts.component.ProjectComponentIdentifier) {
                        if (!allowedRuntime.contains(component.id.projectPath)) {
                            violations.add("${projectPath}:runtimeClasspath -> ${component.id.projectPath}")
                        }
                    } else if (!(projectPath == ':markdown-commonmark'
                        && component.moduleVersion?.group == 'org.commonmark'
                        && component.moduleVersion?.version == '0.24.0'
                        && component.moduleVersion?.name in ['commonmark', 'commonmark-ext-gfm-tables',
                            'commonmark-ext-gfm-strikethrough', 'commonmark-ext-task-list-items'])) {
                        violations.add("${projectPath}:runtimeClasspath -> ${component.id.displayName}")
                    }
                }
        }
        // Resolve through a consumer with a Java 17 requirement, independently
        // of the Java 25 compiler and desktop integration test configurations.
        java17Consumer.incoming.resolutionResult.allDependencies.each { dependency ->
            if (dependency instanceof org.gradle.api.artifacts.result.UnresolvedDependencyResult) {
                violations.add("Java 17 consumer: ${dependency.failure.message}")
            }
        }

        if (!violations.isEmpty()) {
            throw new GradleException(
                'Forbidden direct dependencies:\n  ' + violations.sort().join('\n  ')
            )
        }
    }
}

def markdownJava17ApiConsumer = configurations.create('markdownJava17ApiConsumer') {
    canBeConsumed = false
    canBeResolved = true
    attributes {
        attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_API))
        attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
        attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
        attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 17)
    }
}
dependencies {
    add('markdownJava17ApiConsumer', project(':markdown-commonmark'))
    add('markdownJava17ApiConsumer', project(':markdown-math'))
    add('markdownJava17ApiConsumer', project(':markdown-mermaid'))
}
def markdownProbeClasses = layout.buildDirectory.dir('compatibility/java17-markdown-api')
def verifyMarkdownJava17Api = tasks.register('verifyMarkdownJava17Api', JavaCompile) {
    group = 'verification'
    description = 'Compile a Markdown/math/Mermaid client through the Java 17 public API variants.'
    source(file('verification/compatibility/jvm/PortableMarkdownApiProbe.java'))
    classpath = markdownJava17ApiConsumer
    destinationDirectory = markdownProbeClasses
    sourceCompatibility = '17'
    targetCompatibility = '17'
    options.release = 17
    javaCompiler = providers.provider {
        projectsByPath[':markdown-commonmark'].tasks.named('compileJava', JavaCompile).get().javaCompiler.get()
    }
}
def verifyMarkdownJvm = tasks.register('verifyMarkdownJvm', JavaExec) {
    group = 'verification'
    description = 'Run the external Markdown/math/Mermaid consumer on Java 17.'
    dependsOn(verifyMarkdownJava17Api)
    classpath = files(markdownProbeClasses, java17Consumer)
    mainClass = 'dev.tuink.compat.PortableMarkdownApiProbe'
    maxHeapSize = '256m'
    javaLauncher = projectsByPath[':markdown-commonmark'].javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
}
tasks.register('writeMarkdownRuntimeClasspath') {
    group = 'verification'
    description = 'Export the complete portable runtime JAR set for the external D8/R8 consumer.'
    dependsOn(java17Consumer)
    inputs.files(java17Consumer)
    def output = layout.buildDirectory.file('compatibility/markdown-runtime-classpath.txt')
    outputs.file(output)
    notCompatibleWithConfigurationCache('Exports a resolved portable runtime graph for an external tool.')
    doLast {
        File target = output.get().asFile
        target.parentFile.mkdirs()
        target.setText(java17Consumer.files.collect { it.absolutePath }.sort().join('\n') + '\n', 'UTF-8')
    }
}

tasks.named('check') {
    dependsOn(verifyMarkdownJvm)
    dependsOn(verifyProjectDependencies)
    dependsOn(verifyCoreJava17Api)
    dependsOn(verifySessionJava17Api)
    dependsOn(subprojects.collect { it.tasks.named('check') })
}

tasks.register('buildHelp') {
    group = 'help'
    description = 'Print the supported TUInk build, packaging, and release commands.'

    doLast {
        println """
            TUInk ${rootVersionForHelp} build help

            JVM development (Java 25 toolchain, downloaded when needed)
              ./gradlew check
              ./gradlew --console=plain :app:run --args='file.txt'

            JVM distributions (README, docs, samples, licenses and notices)
              ./gradlew :app:dist
                  Directory: apps/tuink/launcher/build/install/tuink/
              ./gradlew :app:distZip
                  ZIP: build/releases/tuink-${rootVersionForHelp}.zip

            Native builds (Oracle GraalVM 25.0.4+7.1 with Native Image)
              export JAVA_HOME=/absolute/path/to/graalvm-jdk-25.0.4+7.1
              export GRAALVM_HOME=\$JAVA_HOME
              ./gradlew :app:nativeDist
                  Bare executable: build/native-dist/glibc/tuink
              ./gradlew :app:nativeDistTarGz
                  Archive with documentation and licenses: build/releases/
              ./gradlew :app:nativeDeb
                  Debian package: build/releases/tuink_${rootVersionForHelp}_<arch>.deb
                  glibc only; -Ppgo replaces its binary with the PGO variant.

            Native flags
              -Pmusl selects static musl; default: glibc.
              -Ppgo selects PGO; combine with -Pmusl for musl PGO.
              Empty/true enables a flag; false disables it.
              -Ptarget=all selects both libc targets; -PenablePgo aliases -Ppgo.
              Bare binaries use separate glibc, musl, glibc-pgo, musl-pgo folders.

            PGO (Oracle GraalVM Native Image required, not ordinary Oracle JDK)
              ./gradlew :app:nativeProfileTrain -Ppgo -Ptarget=all
                  Train separate glibc and musl profiles; needs POSIX Python 3.10+.
              ./gradlew :app:nativeDist -Ppgo [-Pmusl]
                  Build from an existing matching profile; never trains implicitly.
                  GraalVM Community does not support PGO.

            Render benchmarks (same -Pmusl / -Ppgo variant selection)
              ./gradlew :app:perfSmoke
              ./gradlew :app:perfCheck -PperfLabel=<label> -PperfRepeats=<n>
                  Results: build/performance/render/

            Archives and releases
              ./gradlew :app:distributionArchives -Ptarget=all -Ppgo
                  Five archives: JVM ZIP and ordinary/PGO glibc/musl tar.gz files.
                  Requires trained profiles; no tests, benchmarks or DEB.
              ./gradlew :app:releaseChecksums [-Pmusl] [-Ppgo]
                  Selected archives and ARCHIVE_SHA256SUMS; no DEB, tests or benchmarks.
              ./gradlew clean :app:release [-Ptarget=all] [-Ppgo]
                  Tests, selected archives, smoke benchmarks and checksums.
                  Includes one glibc DEB when glibc is selected; uses PGO with -Ppgo.
                  Writes SHA256SUMS; musl-only releases omit DEB.
                  Both release and nativeDeb require nativeMarch=compatibility.

            More commands and advanced settings
              ./gradlew :app:tasks --group distribution
              ./gradlew help --task :app:release
              docs/building.md, docs/packaging.md, verification/performance/README.md
        """.stripIndent().trim()
    }
}
