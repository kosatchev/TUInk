import org.gradle.api.attributes.Category
import org.gradle.api.attributes.LibraryElements
import org.gradle.api.attributes.Usage

plugins {
    id 'base'
}

allprojects {
    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenCentral()
    }

    dependencyLocking {
        lockAllConfigurations()
        lockMode = org.gradle.api.artifacts.dsl.LockMode.STRICT
    }
}

// The build JDK is independent of a library's runtime API baseline. Only the
// modules already checked against Java 17 belong here; this is not an Android
// compatibility claim for the remaining editor runtime.
def java17Libraries = [':unicode-text', ':editor-contract', ':core', ':editor-session',
                       ':highlight-regex', ':editor-diff-jgit', ':markdown-preview',
                       ':markdown-commonmark', ':markdown-math', ':markdown-mermaid'] as Set

subprojects {
    pluginManager.withPlugin('java') {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(25)
            }
        }

        if (java17Libraries.contains(path)) {
            java {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            tasks.named('compileJava', JavaCompile) {
                options.release = 17
            }
            // Desktop integration tests may consume terminal/platform adapters;
            // their JVM requirement must not raise the published library variant.
            tasks.named('compileTestJava', JavaCompile) {
                sourceCompatibility = '25'
                targetCompatibility = '25'
            }
            configurations.matching { it.name in ['testCompileClasspath', 'testRuntimeClasspath'] }
                .configureEach {
                    attributes.attribute(
                        org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
                }
        }

        tasks.withType(Test).configureEach {
            useJUnitPlatform()
            jvmArgs '--enable-native-access=ALL-UNNAMED'
        }

        dependencies {
            testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
            testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
        }
    }
}

