plugins {
    id 'base'
}

allprojects {
    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenCentral()
    }

    dependencyLocking {
        lockAllConfigurations()
        lockMode = org.gradle.api.artifacts.dsl.LockMode.STRICT
    }
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
    }
}

def allowedProjectDependencies = [
    ':unicode-text'    : [] as Set,
    ':tuiframe-core'   : [] as Set,
    ':tuiframe-jline'  : [':tuiframe-core'] as Set,
    ':tuiframe-widgets': [':tuiframe-core'] as Set,
    ':editor-contract' : [] as Set,
    ':core'            : [':unicode-text'] as Set,
    ':editor-session'  : [':editor-contract', ':core'] as Set,
    ':render'          : [':tuiframe-core', ':editor-contract', ':core'] as Set,
    ':highlight-regex' : [':editor-contract', ':render'] as Set,
    ':tui'             : [':tuiframe-core', ':tuiframe-jline', ':tuiframe-widgets', ':editor-contract', ':core',
                         ':editor-session', ':render', ':highlight-regex'] as Set,
    ':app'            : [':tui'] as Set
]
def expectedProjectGroups = [
    ':tuiframe-core'   : 'dev.tuiframe',
    ':tuiframe-jline'  : 'dev.tuiframe',
    ':tuiframe-widgets': 'dev.tuiframe'
]
def externallyDependencyFreeProductionConfigurations = [
    'annotationProcessor',
    'api',
    'compileOnly',
    'compileOnlyApi',
    'implementation',
    'runtimeOnly'
] as Set
def projectsByPath = subprojects.collectEntries { [(it.path): it] }
def rootVersionForHelp = rootProject.version.toString()

def verifyProjectDependencies = tasks.register('verifyProjectDependencies') {
    group = 'verification'
    description = 'Verify direct module dependencies and terminal-backend isolation.'
    notCompatibleWithConfigurationCache('Reads the configured multi-project dependency model.')

    doLast {
        Set<String> currentProjects = subprojects.collect { it.path } as Set
        Set<String> unclassifiedProjects = currentProjects - allowedProjectDependencies.keySet()
        if (!unclassifiedProjects.isEmpty()) {
            throw new GradleException(
                "Unclassified project modules: ${unclassifiedProjects.sort()}. "
                    + 'Add their allowed dependencies to allowedProjectDependencies.'
            )
        }

        Set<String> violations = [] as Set
        expectedProjectGroups.each { projectPath, expectedGroup ->
            String actualGroup = projectsByPath[projectPath].group.toString()
            if (actualGroup != expectedGroup) {
                violations.add(
                    "${projectPath} has Maven group ${actualGroup}; expected ${expectedGroup}"
                )
            }
        }
        subprojects.each { sourceProject ->
            Set<String> allowed = allowedProjectDependencies[sourceProject.path]
            sourceProject.configurations.each { configuration ->
                configuration.dependencies
                    .withType(org.gradle.api.artifacts.ProjectDependency)
                    .each { dependency ->
                        if (dependency.path != sourceProject.path && !allowed.contains(dependency.path)) {
                            violations.add(
                                "${sourceProject.path}:${configuration.name} -> ${dependency.path}"
                            )
                        }
                    }
                configuration.dependencies
                    .withType(org.gradle.api.artifacts.ExternalModuleDependency)
                    .each { dependency ->
                        if (sourceProject.path != ':tuiframe-jline' && dependency.group == 'org.jline') {
                            violations.add(
                                "${sourceProject.path}:${configuration.name} -> "
                                    + "${dependency.group}:${dependency.name}"
                            )
                        }
                        if ([':unicode-text', ':tuiframe-core', ':tuiframe-widgets', ':editor-contract',
                             ':editor-session'].contains(sourceProject.path)
                            && externallyDependencyFreeProductionConfigurations.contains(configuration.name)) {
                            violations.add(
                                "${sourceProject.path}:${configuration.name} -> "
                                    + "${dependency.group}:${dependency.name}"
                            )
                        }
                    }
            }
        }

        projectsByPath[':editor-session'].configurations
            .matching { it.name in ['api', 'compileOnlyApi'] }
            .each { configuration ->
                configuration.dependencies
                    .withType(org.gradle.api.artifacts.ProjectDependency)
                    .matching { it.path == ':core' }
                    .each {
                        violations.add(
                            ":editor-session:${configuration.name} must not export :core"
                        )
                    }
            }

        if (!violations.isEmpty()) {
            throw new GradleException(
                'Forbidden direct dependencies:\n  ' + violations.sort().join('\n  ')
            )
        }
    }
}

tasks.named('check') {
    dependsOn(verifyProjectDependencies)
    dependsOn(subprojects.collect { it.tasks.named('check') })
}

tasks.register('buildHelp') {
    group = 'help'
    description = 'Print the supported TUInk build, packaging, and release commands.'

    doLast {
        println """
            TUInk ${rootVersionForHelp} build help

            JVM development
              Java 25 is selected through Gradle toolchains and downloaded when needed.
              ./gradlew check
                  Run all module tests and architecture checks.
              ./gradlew clean check build
                  Clean, verify, and build the complete multi-module JVM project.
              ./gradlew --console=plain :app:run
                  Run the canonical application entrypoint in an interactive TTY.

            JVM distribution
              ./gradlew :app:installDist
                  Installed layout: apps/tuink/launcher/build/install/tuink/
              ./gradlew :app:distZip
                  ZIP: build/releases/tuink-${rootVersionForHelp}.zip

            Native binaries (use the pinned Oracle GraalVM SDK with Java 25)
              export JAVA_HOME=/absolute/path/to/graalvm-jdk-25.0.4+7.1
              export GRAALVM_HOME=\$JAVA_HOME
              ./gradlew :app:verifyNativeToolchain
                  Verify the explicit native toolchain before building.
              ./gradlew :app:nativeGlibc
                  Binary: apps/tuink/launcher/build/native/nativeCompile/tuink
              ./gradlew :app:nativeMusl
                  Static binary: apps/tuink/launcher/build/native/nativeMuslCompile/tuink-musl
              ./gradlew :app:nativeAll
                  Build both native binaries.

            Optional PGO (same Oracle SDK, POSIX Python 3.10+)
              ./gradlew :app:pgoHarnessTest
                  Validate the PGO harness without a native build.
              ./gradlew :app:nativeProfileInstrument -PenablePgo
              ./gradlew :app:nativeProfileTrain -PenablePgo
              ./gradlew :app:nativeProfileBuild -PenablePgo
                  Train five checked sessions and build a separate glibc PGO binary.
              ./gradlew :app:nativeProfileOptimize -PenablePgo
                  Run fresh training and the optimized build together.
                  Binary: apps/tuink/launcher/build/native/nativePgoOptimizedCompile/tuink-pgo
                  Profile: .local/pgo/glibc/profile.iprof with adjacent .json receipt.
                  -PpgoProfile=<path> selects a custom profile and adjacent receipt.
                  Use -Ptarget=musl for a separate musl profile/binary; all is rejected.
                  PGO is experimental; release packaging uses the ordinary O3 binary.

            Native archives
              ./gradlew :app:nativeDistTarGz
                  Build the default glibc tar.gz in build/releases/.
              ./gradlew :app:nativeDistTarGz -Ptarget=musl
                  Build the musl tar.gz.
              ./gradlew :app:nativeDistTarGz -Ptarget=all
                  Build both native archives.

            Debian package (Linux, glibc target)
              ./gradlew :app:nativeDeb
                  Package: build/releases/tuink_${rootVersionForHelp}_<deb-arch>.deb

            Render performance
              ./gradlew :app:perfHarnessTest
                  Validate the benchmark fixture, parser, and statistics.
              ./gradlew :app:perfSmoke
                  Run a short native PTY smoke benchmark.
              ./gradlew :app:perfCheck
                  Run 600 events in three repeats for Down, Shift+Down,
                  and mouse drag. Results: build/performance/render/.
              ./gradlew :app:perfCheck -PperfLabel=<label> -PperfRepeats=<n>
                  Label a run or override the repeat count.

            Complete release
              ./gradlew clean :app:release
                  Run tests and build the JVM ZIP, glibc archive, Debian package,
                  build/releases/SHA256SUMS, and the render smoke benchmark.
              ./gradlew clean :app:release -Ptarget=all
                  Also include the musl archive.

            Useful inspection
              ./gradlew :app:tasks --group distribution
              ./gradlew help --task :app:release

            Notes
              Module JARs are internal build artifacts, not the supported standalone
              distribution. Use :app:distZip for a JVM release.
              Detailed docs: docs/building.md and docs/packaging.md
        """.stripIndent().trim()
    }
}
