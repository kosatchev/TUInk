import org.apache.tools.ant.taskdefs.condition.Os
import org.apache.tools.ant.filters.ReplaceTokens
import org.gradle.api.file.ArchiveOperations
import javax.inject.Inject

abstract class DistributionArchiveServices {
    @Inject
    abstract ArchiveOperations getArchiveOperations()
}

def archiveOperations = objects.newInstance(DistributionArchiveServices).archiveOperations
def releaseVersion = project.version.toString()

def nativeTarget = (project.findProperty('target') ?: 'glibc').toString().toLowerCase()
if (!(nativeTarget in ['glibc', 'musl', 'all'])) {
    throw new GradleException("Unsupported -Ptarget=${nativeTarget}. Use glibc, musl, or all.")
}

def osToken = Os.isFamily(Os.FAMILY_WINDOWS)
    ? 'windows'
    : (Os.isFamily(Os.FAMILY_MAC) ? 'macos' : 'linux')
def archToken = {
    def raw = System.getProperty('os.arch', 'x86_64').toLowerCase()
    if (raw == 'amd64') return 'x86_64'
    if (raw == 'aarch64') return 'arm64'
    return raw.replaceAll('[^a-z0-9_\\-]', '_')
}.call()

def glibcReleaseName = "tuink-${releaseVersion}-${osToken}-${archToken}"
def muslReleaseName = "${glibcReleaseName}-musl"
def distributionDir = rootProject.layout.buildDirectory.dir('releases')
apply from: rootProject.file('gradle/scripts/distribution-documentation.gradle')
def verifyDocumentationLinks = verifyDistributionDocumentationLinks
def documentationLinksTest = tasks.named('documentationLinksTest')
def documentationFor = releaseDocumentationFor
def archiveDocumentationRef = distributionDocumentationRef

def nativeExecutableNames = ['tuink', 'install.sh', 'uninstall.sh']
def verifyNativeExecutablePermissions = { FileTree contents, String archiveRoot ->
    Set<String> missing = nativeExecutableNames.collect { "${archiveRoot}/${it}".toString() } as Set
    contents.visit { entry ->
        def path = entry.relativePath.pathString
        if (missing.contains(path)) {
            if (entry.directory || entry.permissions.toUnixNumeric() != 0755) {
                throw new GradleException("Native archive executable must have permissions 0755: ${path}")
            }
            missing.remove(path)
        }
    }
    if (!missing.isEmpty()) {
        throw new GradleException('Native archive executables not found: ' + missing.join(', '))
    }
}
def jvmDocumentationRoot = "tuink-${releaseVersion}".toString()
def releaseSamplesDir = rootProject.file('apps/tuink/samples')
def archiveInstallScripts = rootProject.files(
    rootProject.file('apps/tuink/packaging/archive/install.sh'),
    rootProject.file('apps/tuink/packaging/archive/uninstall.sh')
)

ext.releaseArtifactFiles = objects.fileCollection()
def releaseArtifacts = releaseArtifactFiles

distributions {
    main {
        contents {
            with(documentationFor.call('jvm'))
            from(releaseSamplesDir) {
                into('samples')
            }
        }
    }
}

def jvmDistZip = tasks.named('distZip', Zip) {
    destinationDirectory = distributionDir
    doLast {
        verifyDocumentationLinks.call(archiveOperations.zipTree(archiveFile.get()), jvmDocumentationRoot)
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('stageNativeGlibc', Sync) {
    group = 'distribution'
    description = 'Prepare the glibc native release directory before packaging.'
    dependsOn(tasks.named('nativeCompile'))
    into(layout.buildDirectory.dir("staging/glibc/${glibcReleaseName}"))
    dirPermissions {
        unix('rwxr-xr-x')
    }

    from(layout.buildDirectory.file('native/nativeCompile/tuink')) {
        filePermissions {
            unix('rwxr-xr-x')
        }
    }
    inputs.property('documentationRef', archiveDocumentationRef)
    from(archiveInstallScripts) {
        filter(ReplaceTokens, tokens: [TUINK_DOCUMENTATION_REF: archiveDocumentationRef.get()])
        filePermissions {
            unix('rwxr-xr-x')
        }
    }
    with(documentationFor.call('glibc'))
    from(releaseSamplesDir) {
        into('samples')
        filePermissions {
            unix('rw-r--r--')
        }
    }
}

tasks.register('stageNativeMusl', Sync) {
    group = 'distribution'
    description = 'Prepare the musl native release directory before packaging.'
    dependsOn(tasks.named('nativeMuslCompile'))
    into(layout.buildDirectory.dir("staging/musl/${muslReleaseName}"))
    dirPermissions {
        unix('rwxr-xr-x')
    }

    from(layout.buildDirectory.file('native/nativeMuslCompile/tuink-musl')) {
        rename { 'tuink' }
        filePermissions {
            unix('rwxr-xr-x')
        }
    }
    inputs.property('documentationRef', archiveDocumentationRef)
    from(archiveInstallScripts) {
        filter(ReplaceTokens, tokens: [TUINK_DOCUMENTATION_REF: archiveDocumentationRef.get()])
        filePermissions {
            unix('rwxr-xr-x')
        }
    }
    with(documentationFor.call('musl'))
    from(releaseSamplesDir) {
        into('samples')
        filePermissions {
            unix('rw-r--r--')
        }
    }
}

def nativeTarGz = tasks.register('nativeTarGz', Tar) {
    group = 'distribution'
    description = 'Build the glibc native tar.gz release archive.'
    dependsOn(tasks.named('stageNativeGlibc'))
    compression = Compression.GZIP
    archiveBaseName = 'tuink'
    archiveVersion = releaseVersion
    archiveClassifier = "${osToken}-${archToken}"
    archiveExtension = 'tar.gz'
    destinationDirectory = distributionDir

    from(layout.buildDirectory.dir("staging/glibc/${glibcReleaseName}")) {
        into(glibcReleaseName)
        exclude(nativeExecutableNames)
    }
    from(layout.buildDirectory.dir("staging/glibc/${glibcReleaseName}")) {
        into(glibcReleaseName)
        include(nativeExecutableNames)
        filePermissions {
            unix('rwxr-xr-x')
        }
    }
    doLast {
        def contents = archiveOperations.tarTree(archiveOperations.gzip(archiveFile.get()))
        verifyDocumentationLinks.call(contents, glibcReleaseName)
        verifyNativeExecutablePermissions.call(contents, glibcReleaseName)
    }
}

def nativeMuslTarGz = tasks.register('nativeMuslTarGz', Tar) {
    group = 'distribution'
    description = 'Build the musl native tar.gz release archive.'
    dependsOn(tasks.named('stageNativeMusl'))
    compression = Compression.GZIP
    archiveBaseName = 'tuink'
    archiveVersion = releaseVersion
    archiveClassifier = "${osToken}-${archToken}-musl"
    archiveExtension = 'tar.gz'
    destinationDirectory = distributionDir

    from(layout.buildDirectory.dir("staging/musl/${muslReleaseName}")) {
        into(muslReleaseName)
        exclude(nativeExecutableNames)
    }
    from(layout.buildDirectory.dir("staging/musl/${muslReleaseName}")) {
        into(muslReleaseName)
        include(nativeExecutableNames)
        filePermissions {
            unix('rwxr-xr-x')
        }
    }
    doLast {
        def contents = archiveOperations.tarTree(archiveOperations.gzip(archiveFile.get()))
        verifyDocumentationLinks.call(contents, muslReleaseName)
        verifyNativeExecutablePermissions.call(contents, muslReleaseName)
    }
}

tasks.register('nativeDistTarGz') {
    group = 'distribution'
    description = 'Build native tar.gz release archives. Use -Ptarget=glibc|musl|all (default: glibc).'
    if (nativeTarget == 'glibc') {
        dependsOn(nativeTarGz)
        releaseArtifactFiles.from(nativeTarGz.flatMap { it.archiveFile })
    } else if (nativeTarget == 'musl') {
        dependsOn(nativeMuslTarGz)
        releaseArtifactFiles.from(nativeMuslTarGz.flatMap { it.archiveFile })
    } else {
        dependsOn(nativeTarGz, nativeMuslTarGz)
        releaseArtifactFiles.from(nativeTarGz.flatMap { it.archiveFile })
        releaseArtifactFiles.from(nativeMuslTarGz.flatMap { it.archiveFile })
    }
}

tasks.register('releaseChecksums') {
    group = 'distribution'
    description = 'Write SHA256SUMS for all artifacts produced by the release task.'
    dependsOn(tasks.named('nativeDistTarGz'))
    dependsOn(jvmDistZip)
    releaseArtifactFiles.from(jvmDistZip.flatMap { it.archiveFile })
    inputs.files(releaseArtifactFiles)
    def checksumFile = distributionDir.map { it.file('SHA256SUMS') }
    outputs.file(checksumFile)

    doLast {
        def lines = releaseArtifacts.files
            .sort { left, right -> left.name <=> right.name }
            .collect { artifact ->
                if (!artifact.isFile()) {
                    throw new GradleException("Release artifact not found: ${artifact}")
                }
                def digest = java.security.MessageDigest.getInstance('SHA-256')
                artifact.withInputStream { stream ->
                    byte[] buffer = new byte[8192]
                    int count
                    while ((count = stream.read(buffer)) != -1) {
                        digest.update(buffer, 0, count)
                    }
                }
                "${digest.digest().encodeHex()}  ${artifact.name}"
            }
        def output = checksumFile.get().asFile
        output.parentFile.mkdirs()
        output.setText(lines.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
    }
}

tasks.named('installDist', Sync) {
    dependsOn(documentationLinksTest)
    doLast {
        verifyDocumentationLinks.call(fileTree(destinationDir), '')
    }
}
