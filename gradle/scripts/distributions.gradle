import org.apache.tools.ant.taskdefs.condition.Os
import org.apache.tools.ant.filters.ReplaceTokens
import org.gradle.api.file.ArchiveOperations
import javax.inject.Inject

abstract class DistributionArchiveServices {
    @Inject
    abstract ArchiveOperations getArchiveOperations()
}

def archiveOperations = objects.newInstance(DistributionArchiveServices).archiveOperations
def releaseVersion = project.version.toString()

def osToken = Os.isFamily(Os.FAMILY_WINDOWS)
    ? 'windows'
    : (Os.isFamily(Os.FAMILY_MAC) ? 'macos' : 'linux')
def archToken = {
    def raw = System.getProperty('os.arch', 'x86_64').toLowerCase()
    if (raw == 'amd64') return 'x86_64'
    if (raw == 'aarch64') return 'arm64'
    return raw.replaceAll('[^a-z0-9_\\-]', '_')
}.call()

def nativeReleaseName = "tuink-${releaseVersion}-${osToken}-${archToken}"
def distributionDir = rootProject.layout.buildDirectory.dir('releases')
apply from: rootProject.file('gradle/scripts/distribution-documentation.gradle')
def verifyDocumentationLinks = verifyDistributionDocumentationLinks
def documentationLinksTest = tasks.named('documentationLinksTest')
def documentationFor = releaseDocumentationFor
def archiveDocumentationRef = distributionDocumentationRef

def nativeExecutableNames = ['tuink', 'install.sh', 'uninstall.sh']
def verifyNativeExecutablePermissions = { FileTree contents, String archiveRoot ->
    Set<String> missing = nativeExecutableNames.collect { "${archiveRoot}/${it}".toString() } as Set
    contents.visit { entry ->
        def path = entry.relativePath.pathString
        if (missing.contains(path)) {
            if (entry.directory || entry.permissions.toUnixNumeric() != 0755) {
                throw new GradleException("Native archive executable must have permissions 0755: ${path}")
            }
            missing.remove(path)
        }
    }
    if (!missing.isEmpty()) {
        throw new GradleException('Native archive executables not found: ' + missing.join(', '))
    }
}
def jvmDocumentationRoot = "tuink-${releaseVersion}".toString()
def releaseSamplesDir = rootProject.file('apps/tuink/samples')
def archiveInstallScripts = rootProject.files(
    rootProject.file('apps/tuink/packaging/archive/install.sh'),
    rootProject.file('apps/tuink/packaging/archive/uninstall.sh')
)

distributions {
    main {
        contents {
            with(documentationFor.call('jvm'))
            from(releaseSamplesDir) {
                into('samples')
            }
        }
    }
}

def jvmDistZip = tasks.named('distZip', Zip) {
    destinationDirectory = distributionDir
    doLast {
        verifyDocumentationLinks.call(archiveOperations.zipTree(archiveFile.get()), jvmDocumentationRoot)
    }
}

// The unpacked JVM distribution and its ZIP share user documents, notices,
// demo images and samples through distributions.main.contents above.
tasks.register('dist') {
    group = 'distribution'
    description = 'Build the unpacked JVM distribution with launchers, libraries and documentation.'
    dependsOn(tasks.named('installDist'))
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// All four native archives share documentation, Oracle runtime notices, samples,
// installation scripts and executable-permission checks. Only optimized PGO
// outputs are packaged; training binaries and profiles are intermediate inputs.
def registerNativeDistribution = { String target, boolean pgo ->
    String pgoSuffix = pgo ? 'Pgo' : ''
    String variant = target + (pgo ? '-pgo' : '')
    String releaseSuffix = (target == 'musl' ? '-musl' : '') + (pgo ? '-pgo' : '')
    String releaseName = nativeReleaseName + releaseSuffix + tuinkNativeCpuSuffix
    def compileTask = tuinkNativeCompiler(target, pgo)
    // Separate output directories keep flag changes from overwriting another
    // variant. nativeDist exports just the executable; the tar.gz carries docs.
    def binary = tasks.register("exportNative${target.capitalize()}${pgoSuffix}", Sync) {
        description = "Export the ${variant} native executable without an archive."
        dependsOn(compileTask)
        into(rootProject.layout.buildDirectory.dir("native-dist/${variant}${tuinkNativeCpuSuffix}"))
        dirPermissions {
            unix('rwxr-xr-x')
        }
        from(compileTask.flatMap { it.outputFile }) {
            rename { 'tuink' }
            filePermissions {
                unix('rwxr-xr-x')
            }
        }
    }
    def stagingDirectory = layout.buildDirectory.dir("staging/${variant}/${releaseName}")
    def stage = tasks.register("stageNative${pgoSuffix}${target.capitalize()}", Sync) {
        description = "Prepare the ${variant} Oracle GraalVM native release directory."
        dependsOn(compileTask)
        into(stagingDirectory)
        dirPermissions {
            unix('rwxr-xr-x')
        }
        from(compileTask.flatMap { it.outputFile }) {
            rename { 'tuink' }
            filePermissions {
                unix('rwxr-xr-x')
            }
        }
        inputs.property('documentationRef', archiveDocumentationRef)
        from(archiveInstallScripts) {
            filter(ReplaceTokens, tokens: [TUINK_DOCUMENTATION_REF: archiveDocumentationRef.get()])
            filePermissions {
                unix('rwxr-xr-x')
            }
        }
        with(documentationFor.call(target))
        from(releaseSamplesDir) {
            into('samples')
            filePermissions {
                unix('rw-r--r--')
            }
        }
    }
    def archive = tasks.register("packageNative${target.capitalize()}${pgoSuffix}", Tar) {
        description = "Build the ${variant} Oracle GraalVM native tar.gz release archive."
        dependsOn(stage)
        compression = Compression.GZIP
        archiveBaseName = 'tuink'
        archiveVersion = releaseVersion
        archiveClassifier = "${osToken}-${archToken}${releaseSuffix}${tuinkNativeCpuSuffix}"
        archiveExtension = 'tar.gz'
        destinationDirectory = distributionDir

        from(stagingDirectory) {
            into(releaseName)
            exclude(nativeExecutableNames)
        }
        from(stagingDirectory) {
            into(releaseName)
            include(nativeExecutableNames)
            filePermissions {
                unix('rwxr-xr-x')
            }
        }
        doLast {
            def contents = archiveOperations.tarTree(archiveOperations.gzip(archiveFile.get()))
            verifyDocumentationLinks.call(contents, releaseName)
            verifyNativeExecutablePermissions.call(contents, releaseName)
        }
    }
    [binary: binary, archive: archive]
}

// One descriptor per variant serves the bare binary, tar.gz and release tasks.
def nativeDistributions = [:]
['glibc', 'musl'].each { target ->
    (tuinkPgo ? [false, true] : [false]).each { pgo ->
        nativeDistributions[target + (pgo ? '-pgo' : '')] = registerNativeDistribution(target, pgo)
    }
}
def distributionFor = { String target, boolean pgo ->
    nativeDistributions[target + (pgo ? '-pgo' : '')]
}
def selected = tuinkNativeTargets.collect { distributionFor(it, tuinkPgo) }

tasks.register('nativeDist') {
    group = 'distribution'
    description = 'Build a native executable. Use -Pmusl and/or -Ppgo (default: glibc without PGO).'
    dependsOn(selected.collect { it.binary })
}
tasks.register('nativeDistTarGz') {
    group = 'distribution'
    description = 'Build a native tar.gz with README, licenses and notices. Use -Pmusl and/or -Ppgo.'
    dependsOn(selected.collect { it.archive })
}

// Keep old entry points as aliases, rather than maintaining another selector.
[nativeTarGz: 'glibc', nativeMuslTarGz: 'musl'].each { name, target ->
    tasks.register(name) {
        description = "Compatibility alias: package ${target}, honoring -Ppgo."
        dependsOn {
            tuinkRequireNativeTarget(target)
            distributionFor(target, tuinkPgo).archive
        }
    }
}
if (tuinkPgo) {
    [nativePgoTarGz: 'glibc', nativeMuslPgoTarGz: 'musl'].each { name, target ->
        tasks.register(name) {
            description = "Compatibility alias: package the ${target} PGO binary."
            dependsOn {
                tuinkRequireNativeTarget(target)
                distributionFor(target, true).archive
            }
        }
    }
    tasks.register('nativePgoDistTarGz') {
        description = 'Compatibility alias: package the selected PGO binaries.'
        dependsOn(tasks.named('nativeDistTarGz'))
    }
}

// A complete bundle keeps ordinary archives and adds PGO archives when enabled.
def releaseArchives = tuinkNativeTargets.collectMany { target ->
    (tuinkPgo ? [false, true] : [false]).collect { distributionFor(target, it).archive }
}
ext.tuinkArchiveFiles = files(jvmDistZip.flatMap { it.archiveFile },
    releaseArchives.collect { it.flatMap { task -> task.archiveFile } })
tasks.register('distributionArchives') {
    group = 'distribution'
    description = 'Build JVM/native archives; add Oracle PGO with -Ppgo. Use -Ptarget=all for all five variants.'
    dependsOn(jvmDistZip, releaseArchives)
}

tasks.named('installDist', Sync) {
    dependsOn(documentationLinksTest)
    doLast {
        verifyDocumentationLinks.call(fileTree(destinationDir), '')
    }
}
