def jlineNativeExcludes = [
    '--exclude-config', '.*jline-.*\\.jar', 'META-INF/native-image/org\\.jline/.*'
]
def jlineNativeManualArgs = [
    '-H:ResourceConfigurationResources=' +
        'META-INF/native-image/org.jline/jline-native/resource-config.json,' +
        'META-INF/native-image/org.jline/jline-terminal/resource-config.json,' +
        'META-INF/native-image/org.jline/jline-terminal-jni/resource-config.json',
    '-H:ReflectionConfigurationResources=' +
        'META-INF/native-image/org.jline/jline-native/reflection-config.json,' +
        'META-INF/native-image/org.jline/jline-terminal/reflection-config.json,' +
        'META-INF/native-image/org.jline/jline-terminal-jni/reflection-config.json',
    '-H:JNIConfigurationResources=META-INF/native-image/org.jline/jline-native/jni-config.json'
]
def nativeMarch = (project.findProperty('nativeMarch') ?: 'compatibility').toString()
def requiredGraalVmVersion = '25.2.4'
def requiredNativeJavaVersion = '25.0.4'
def graalVmHomeEnvironment = providers.environmentVariable('GRAALVM_HOME')
def baseNativeBuildArgs = {
    [
        '-H:+AddAllCharsets',
        '-O2',
        '--gc=serial',
        '-H:+UnlockExperimentalVMOptions'
    ] + jlineNativeExcludes + jlineNativeManualArgs + [
        '-H:-UnlockExperimentalVMOptions'
    ]
}

ext.tuinkNativeMarch = nativeMarch
ext.tuinkBaseNativeBuildArgs = baseNativeBuildArgs

def verifyNativeToolchain = tasks.register('verifyNativeToolchain') {
    group = 'verification'
    description = "Verify the pinned GraalVM Community ${requiredGraalVmVersion} native toolchain."
    notCompatibleWithConfigurationCache('Runs the explicitly selected native toolchain executables.')

    doLast {
        String configuredHome = graalVmHomeEnvironment.orNull?.trim()
        if (!configuredHome) {
            throw new GradleException(
                'GRAALVM_HOME must explicitly select GraalVM Community '
                    + "${requiredGraalVmVersion} (Java ${requiredNativeJavaVersion}) for native builds. "
                    + 'See docs/building.md#native-toolchain.'
            )
        }

        File graalVmHome = new File(configuredHome)
        if (!graalVmHome.isAbsolute()) {
            throw new GradleException("GRAALVM_HOME must be an absolute path: ${configuredHome}")
        }
        graalVmHome = graalVmHome.canonicalFile

        File releaseFile = new File(graalVmHome, 'release')
        if (!releaseFile.isFile()) {
            throw new GradleException("GRAALVM_HOME has no release metadata: ${releaseFile}")
        }

        Map<String, String> releaseMetadata = [:]
        releaseFile.eachLine('UTF-8') { line ->
            def match = line =~ /^([A-Z0-9_]+)="(.*)"$/
            if (match.matches()) {
                releaseMetadata[match.group(1)] = match.group(2)
            }
        }

        Map<String, String> expectedMetadata = [
            IMPLEMENTOR: 'GraalVM Community',
            GRAALVM_VERSION: requiredGraalVmVersion,
            JAVA_VERSION: requiredNativeJavaVersion
        ]
        expectedMetadata.each { key, expected ->
            String actual = releaseMetadata[key]
            if (actual != expected) {
                throw new GradleException(
                    "Unsupported native toolchain at ${graalVmHome}: ${key}="
                        + "${actual ?: '<missing>'}; expected ${expected}."
                )
            }
        }

        File javaExecutable = new File(graalVmHome, 'bin/java')
        File nativeImageExecutable = new File(graalVmHome, 'bin/native-image')
        [javaExecutable, nativeImageExecutable].each { executable ->
            if (!executable.isFile() || !executable.canExecute()) {
                throw new GradleException("Required executable is missing or not executable: ${executable}")
            }
        }

        [javaExecutable, nativeImageExecutable].each { executable ->
            def versionExecution = providers.exec {
                commandLine executable.absolutePath, '--version'
                ignoreExitValue = false
            }
            String versionText = versionExecution.standardOutput.asText.get().concat(
                versionExecution.standardError.asText.get()
            )
            if (!versionText.contains(requiredNativeJavaVersion)
                || !versionText.contains('GraalVM')) {
                throw new GradleException(
                    "Unexpected ${executable.name} --version output from ${graalVmHome}:\n${versionText.trim()}"
                )
            }
        }

        logger.lifecycle(
            "Using GraalVM Community ${requiredGraalVmVersion} "
                + "(Java ${requiredNativeJavaVersion}) from ${graalVmHome}"
        )
    }
}

graalvmNative {
    toolchainDetection = false
    metadataRepository {
        enabled = false
    }
    binaries {
        main {
            imageName = 'tuink'
            mainClass = application.mainClass
            buildArgs.addAll(baseNativeBuildArgs())
            buildArgs.add("-march=${nativeMarch}")
        }
        musl {
            imageName = 'tuink-musl'
            mainClass = application.mainClass
            classpath(sourceSets.main.runtimeClasspath, tasks.named('jar'))
            buildArgs.addAll(baseNativeBuildArgs())
            buildArgs.add("-march=${nativeMarch}")
            buildArgs.add('--static')
            buildArgs.add('--libc=musl')
            buildArgs.add('-Ddev.tuiframe.provider=exec')
        }
    }
}

tasks.configureEach { task ->
    if (task.class.name.contains('BuildNativeImageTask')) {
        task.dependsOn(verifyNativeToolchain)
    }
}

tasks.register('nativeGlibc') {
    group = 'build'
    description = 'Build the glibc native binary.'
    dependsOn(tasks.named('nativeCompile'))
}

tasks.register('nativeMusl') {
    group = 'build'
    description = 'Build the static musl native binary.'
    dependsOn(tasks.named('nativeMuslCompile'))
}

tasks.register('nativeAll') {
    group = 'build'
    description = 'Build both glibc and musl native binaries.'
    dependsOn(tasks.named('nativeCompile'))
    dependsOn(tasks.named('nativeMuslCompile'))
}
