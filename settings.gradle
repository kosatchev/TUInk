plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'tuink'

// Physical ownership groups are independent of the stable Gradle project paths.
// Keep commands such as :app:run and :core:test compatible with existing clients.
def projectDirectories = [
    ':app': 'apps/tuink/launcher',
    ':tui': 'apps/tuink/terminal-ui',
    ':render': 'apps/tuink/terminal-rendering',
    ':editor-contract': 'libs/editor/api',
    ':core': 'libs/editor/engine',
    ':editor-session': 'libs/editor/session',
    ':highlight-regex': 'libs/editor/highlight-regex',
    ':unicode-text': 'libs/unicode-text',
    ':tui-core': 'libs/tuiframe/core',
    ':tui-jline': 'libs/tuiframe/jline',
    ':tui-widgets': 'libs/tuiframe/widgets'
]
projectDirectories.each { projectPath, directory ->
    include projectPath
    project(projectPath).projectDir = file(directory)
}
